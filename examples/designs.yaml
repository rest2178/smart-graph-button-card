# Example 7 – the ready-made designs for a switch with a power sensor.
# The switch is the main entity (tap toggles it), the power sensor feeds
# the graph, the second value and the large value on the right.
# All designs use the normal button height; design_size: double doubles it.
type: grid
columns: 2
square: false
cards:
  # 1 – subtle graph in the background
  - type: custom:smart-graph-button-card
    entity: switch.schreibtisch_1
    icon: mdi:desk
    design: subtle
    graph:
      entity: sensor.schreibtisch_1_leistung
  # 2 – two areas: content on top, separate graph below a thin line
  - type: custom:smart-graph-button-card
    entity: switch.schreibtisch_1
    icon: mdi:desk
    design: split
    graph:
      entity: sensor.schreibtisch_1_leistung
  # 3 – colored status: large value in a filled badge
  - type: custom:smart-graph-button-card
    entity: switch.schreibtisch_1
    icon: mdi:desk
    design: badge
    graph:
      entity: sensor.schreibtisch_1_leistung
  # 4 – minimalistic with a sparkline on the right, twice the button height
  - type: custom:smart-graph-button-card
    entity: switch.schreibtisch_1
    icon: mdi:desk
    design: sparkline
    design_size: double
    graph:
      entity: sensor.schreibtisch_1_leistung
  # 5 – accent bar on the left, line graph in the row, value in a tinted box
  - type: custom:smart-graph-button-card
    entity: switch.schreibtisch_1
    icon: mdi:monitor
    design: panel
    graph:
      entity: sensor.schreibtisch_1_leistung
